name = "correio"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licences = ["Apache-2.0"]
description = "Typed transactional email and application-owned passwordless verification for Gleam."
repository = { type = "github", user = "gleam-dream", repo = "correio" }
internal_modules = ["correio/internal", "correio/internal/*"]

[dependencies]
gen_smtp = "== 1.3.0"
gleam_stdlib = ">= 0.70.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
