name = "passwordless_demo"
version = "0.1.0"
target = "erlang"
licences = ["Apache-2.0"]
description = "Local executable browser consumer of Correio passwordless verification."

[dependencies]
correio = { path = "../.." }
correio_mailbox = { path = "../../adapters/correio_mailbox" }
correio_postgres = { path = "../../adapters/correio_postgres" }
warden = { path = "../../../warden" }
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
pog = ">= 4.0.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
